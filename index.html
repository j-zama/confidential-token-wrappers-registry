<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confidential Token Wrappers Registry</title>
<meta name="description" content="Official ERC-7984 confidential tokens built on the Zama Protocol.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background-color: #FDFCF8;
    background-image:
      /* warm yellow bloom, upper-left */
      radial-gradient(58% 52% at 20% 30%, rgba(255, 209, 74, 0.26) 0%, rgba(255, 209, 74, 0) 68%),
      /* softer yellow, upper-centre */
      radial-gradient(52% 46% at 52% 12%, rgba(255, 226, 122, 0.24) 0%, rgba(255, 226, 122, 0) 70%),
      /* pale butter wash, centre-right */
      radial-gradient(50% 52% at 74% 48%, rgba(255, 240, 176, 0.30) 0%, rgba(255, 240, 176, 0) 72%),
      /* cool lavender edge, top-right */
      radial-gradient(56% 58% at 94% 14%, rgba(222, 227, 244, 0.42) 0%, rgba(222, 227, 244, 0) 70%),
      /* white lift, bottom-left */
      radial-gradient(70% 62% at 6% 92%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 72%);
    background-repeat: no-repeat;
  }
  /* iOS Safari mishandles fixed backgrounds — desktop only */
  @media (min-width: 768px) and (hover: hover) {
    body { background-attachment: fixed; }
  }
  /* Animated mesh — slow drifting blooms layered over the static gradient */
  .mesh { position: fixed; inset: 0; z-index: -10; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }
  .blob-a {
    width: 62vw; height: 62vw; left: -6%; top: -8%;
    background: radial-gradient(circle, rgba(255, 205, 60, 0.22) 0%, rgba(255, 205, 60, 0) 68%);
    animation: drift-a 32s ease-in-out infinite alternate;
  }
  .blob-b {
    width: 54vw; height: 54vw; left: 38%; top: -16%;
    background: radial-gradient(circle, rgba(255, 231, 130, 0.20) 0%, rgba(255, 231, 130, 0) 70%);
    animation: drift-b 26s ease-in-out infinite alternate;
  }
  .blob-c {
    width: 58vw; height: 58vw; left: 46%; top: 30%;
    background: radial-gradient(circle, rgba(255, 243, 186, 0.24) 0%, rgba(255, 243, 186, 0) 72%);
    animation: drift-c 38s ease-in-out infinite alternate;
  }
  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(7vw, 5vh, 0) scale(1.14); }
  }
  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0) scale(1.06); }
    to   { transform: translate3d(-8vw, 7vh, 0) scale(0.94); }
  }
  @keyframes drift-c {
    from { transform: translate3d(0, 0, 0) scale(0.96); }
    to   { transform: translate3d(-5vw, -6vh, 0) scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }

  .mono { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
</style>
</head>

<body class="text-neutral-900 antialiased">

<div class="mesh" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
</div>

<div
  x-data="registry()"
  class="min-h-screen flex items-center justify-center px-4 py-16 sm:py-24"
>
  <div class="w-full max-w-6xl">

    <!-- Header -->
    <header class="text-center">
      <p class="text-[11px] sm:text-xs font-medium tracking-[0.18em] text-neutral-400 uppercase">
        ERC-7984 Confidential Tokens
      </p>
      <h1 class="mt-5 text-4xl sm:text-5xl font-normal tracking-tight">
        Confidential Token Wrappers Registry
      </h1>
      <p class="mt-4 text-base text-neutral-600">
        Official ERC-7984 tokens built on the Zama Protocol.
      </p>
    </header>

    <!-- Controls -->
    <div class="mt-10 flex flex-col items-start gap-3 sm:flex-row sm:items-center">

      <!-- Search -->
      <div class="relative w-full sm:min-w-0 sm:flex-1">
        <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="9" cy="9" r="5.5"/>
          <path d="M13.2 13.2L17 17" stroke-linecap="round"/>
        </svg>
        <input
          x-model="query"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search name, symbol or address"
          aria-label="Search confidential tokens"
          class="w-full rounded-[10px] border border-neutral-300/80 bg-white/70 py-2 pl-10 pr-9 text-sm text-neutral-900 shadow-sm outline-none transition placeholder:text-neutral-400 hover:border-neutral-400 focus:border-neutral-500 focus:bg-white"
        >
        <button
          x-show="query" x-cloak
          @click="query = ''"
          type="button"
          aria-label="Clear search"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 transition hover:text-neutral-900"
        >
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 6l8 8M14 6l-8 8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Network switcher -->
      <div class="relative shrink-0" @click.outside="open = false" @keydown.escape.window="open = false">
        <button
          @click="open = !open"
          type="button"
          class="flex items-center gap-2.5 rounded-[10px] border border-neutral-300/80 bg-white/70 px-4 py-2 text-sm font-medium text-neutral-800 shadow-sm transition hover:bg-white hover:border-neutral-400"
          :aria-expanded="open"
          aria-haspopup="listbox"
        >
          <span class="h-2 w-2 rounded-[10px]" :style="`background:${network.color}`"></span>
          <span x-text="network.name"></span>
          <span
            x-show="network.type === 'testnet'"
            class="rounded-[10px] bg-amber-100 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide text-amber-700"
          >Testnet</span>
          <svg class="h-4 w-4 text-neutral-400 transition" :class="open && 'rotate-180'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M6 8l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <ul
          x-show="open" x-cloak x-transition.opacity.duration.120ms
          role="listbox"
          class="absolute left-0 z-20 mt-2 w-56 overflow-hidden rounded-[10px] border border-neutral-200 bg-white p-1.5 shadow-lg shadow-neutral-900/5 sm:left-auto sm:right-0"
        >
          <template x-for="group in groups" :key="group.label">
            <li>
              <p class="px-3 pb-1 pt-2.5 text-[10px] font-medium uppercase tracking-[0.12em] text-neutral-400" x-text="group.label"></p>
              <ul>
                <template x-for="net in group.items" :key="net.id">
                  <li>
                    <button
                      @click="select(net.id)"
                      type="button"
                      role="option"
                      :aria-selected="net.id === current"
                      class="flex w-full items-center gap-2.5 rounded-[10px] px-3 py-2.5 text-left text-sm transition hover:bg-neutral-100"
                      :class="net.id === current ? 'font-medium text-neutral-900' : 'text-neutral-600'"
                    >
                      <span class="h-2 w-2 shrink-0 rounded-[10px]" :style="`background:${net.color}`"></span>
                      <span x-text="net.name"></span>
                      <svg x-show="net.id === current" class="ml-auto h-4 w-4 text-neutral-900" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M5 10.5l3.5 3.5L15 7" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                  </li>
                </template>
              </ul>
            </li>
          </template>
        </ul>
      </div>
    </div>

    <!-- Category chips -->
    <div x-show="shownCategories.length > 1" class="mt-5 flex flex-wrap items-center gap-2">
      <template x-for="c in shownCategories" :key="c.id">
        <button
          @click="category = c.id"
          type="button"
          :aria-pressed="category === c.id"
          class="flex items-center gap-1.5 rounded-[10px] border px-3 py-1.5 text-[13px] transition"
          :class="category === c.id
            ? 'border-neutral-900 bg-neutral-900 text-white'
            : 'border-neutral-300/80 bg-white/70 text-neutral-600 hover:border-neutral-400 hover:text-neutral-900'"
        >
          <span x-text="c.label"></span>
          <span
            class="text-[11px] tabular-nums"
            :class="category === c.id ? 'text-white/60' : 'text-neutral-400'"
            x-text="countFor(c.id)"
          ></span>
        </button>
      </template>
    </div>

    <!-- Token table -->
    <div class="mt-5 rounded-[10px] bg-white/50 p-2 shadow-[0_1px_2px_rgba(0,0,0,0.04),0_16px_50px_-12px_rgba(120,100,40,0.18)] backdrop-blur-sm">
      <div class="overflow-x-auto rounded-[10px] bg-white/90">
        <table class="w-full min-w-[940px] border-collapse">
          <thead>
            <tr class="border-b border-neutral-200/70">
              <template x-for="col in columns" :key="col.key">
                <th scope="col" class="px-4 py-3.5 font-normal first:pl-5 last:pr-5">
                  <button
                    @click="toggleSort(col.key)"
                    type="button"
                    class="group flex w-full items-center gap-1.5 text-[13px] transition"
                    :class="[
                      col.align === 'right' ? 'justify-end' : 'justify-start',
                      sortKey === col.key ? 'text-neutral-900' : 'text-neutral-500 hover:text-neutral-900'
                    ]"
                    :aria-sort="sortKey === col.key ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'"
                  >
                    <span x-text="col.label"></span>
                    <svg
                      class="h-3 w-3 transition"
                      :class="[
                        sortKey === col.key ? 'text-neutral-900' : 'text-neutral-300 group-hover:text-neutral-500',
                        sortKey === col.key && sortDir === 'desc' ? 'rotate-180' : ''
                      ]"
                      viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"
                    >
                      <path d="M6 10V2M3 5l3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </th>
              </template>
            </tr>
          </thead>

          <tbody>
            <!-- empty state -->
            <template x-if="sorted.length === 0">
              <tr>
                <td :colspan="columns.length" class="px-6 py-14 text-center text-sm text-neutral-500">
                  <span x-show="network.tokens.length === 0">
                    No wrappers deployed on <span x-text="network.name"></span> yet.
                  </span>
                  <span x-show="network.tokens.length > 0">
                    No token matches “<span class="text-neutral-900" x-text="query"></span>” on <span x-text="network.name"></span>.
                  </span>
                </td>
              </tr>
            </template>

            <template x-for="(t, i) in sorted" :key="t.symbol">
              <tr class="transition hover:bg-neutral-50/80" :class="i !== 0 && 'border-t border-neutral-200/70'">

                <!-- Name -->
                <td class="whitespace-nowrap py-4 pl-5 pr-4">
                  <div class="flex items-center gap-3">
                    <span class="relative flex h-8 w-[38px] shrink-0 items-center">
                      <template x-if="t.icon">
                        <img :src="t.icon" alt="" class="h-8 w-auto">
                      </template>
                      <template x-if="!t.icon">
                        <span class="flex h-8 w-8 items-center justify-center rounded-[10px] bg-neutral-200 text-[11px] font-semibold text-neutral-600" x-text="t.symbol.slice(1, 2)"></span>
                      </template>
                    </span>
                    <span class="flex flex-col leading-[1.25]">
                      <span class="text-[15px] text-neutral-900" x-text="t.name"></span>
                      <span class="text-[12px] text-neutral-400" x-text="t.symbol"></span>
                    </span>
                  </div>
                </td>

                <!-- TVS -->
                <td class="whitespace-nowrap px-4 py-4 text-right">
                  <template x-if="metricsFor(t.symbol)">
                    <div>
                      <div class="mono text-[15px] font-semibold text-neutral-900" x-text="fmtUsd(metricsFor(t.symbol).tvsUsd)"></div>
                      <div class="mono text-[12px] text-neutral-400" x-show="metricsFor(t.symbol).tvsTok !== 0" x-text="fmtNum(metricsFor(t.symbol).tvsTok)"></div>
                    </div>
                  </template>
                  <template x-if="!metricsFor(t.symbol)">
                    <span class="mono text-[15px]" :class="loadState === 'loading' ? 'animate-pulse text-neutral-300' : 'text-neutral-300'">—</span>
                  </template>
                </td>

                <!-- Holders -->
                <td class="whitespace-nowrap px-4 py-4 text-right">
                  <template x-if="metricsFor(t.symbol)">
                    <span class="mono text-[15px] text-neutral-900" x-text="fmtInt(metricsFor(t.symbol).holders)"></span>
                  </template>
                  <template x-if="!metricsFor(t.symbol)">
                    <span class="mono text-[15px]" :class="loadState === 'loading' ? 'animate-pulse text-neutral-300' : 'text-neutral-300'">—</span>
                  </template>
                </td>

                <!-- Total Shielded -->
                <td class="whitespace-nowrap px-4 py-4 text-right">
                  <template x-if="metricsFor(t.symbol)">
                    <div>
                      <div class="mono text-[15px] font-semibold text-emerald-700" x-text="fmtUsd(metricsFor(t.symbol).shieldedUsd)"></div>
                      <div class="mono text-[12px] text-neutral-400" x-show="metricsFor(t.symbol).shieldedTok !== 0" x-text="fmtNum(metricsFor(t.symbol).shieldedTok)"></div>
                    </div>
                  </template>
                  <template x-if="!metricsFor(t.symbol)">
                    <span class="mono text-[15px]" :class="loadState === 'loading' ? 'animate-pulse text-neutral-300' : 'text-neutral-300'">—</span>
                  </template>
                </td>

                <!-- Total Unshielded -->
                <td class="whitespace-nowrap px-4 py-4 text-right">
                  <template x-if="metricsFor(t.symbol)">
                    <div>
                      <div class="mono text-[15px] font-semibold text-rose-700" x-text="fmtUsd(metricsFor(t.symbol).unshieldedUsd)"></div>
                      <div class="mono text-[12px] text-neutral-400" x-show="metricsFor(t.symbol).unshieldedTok !== 0" x-text="fmtNum(metricsFor(t.symbol).unshieldedTok)"></div>
                    </div>
                  </template>
                  <template x-if="!metricsFor(t.symbol)">
                    <span class="mono text-[15px]" :class="loadState === 'loading' ? 'animate-pulse text-neutral-300' : 'text-neutral-300'">—</span>
                  </template>
                </td>

                <!-- Contract -->
                <td class="whitespace-nowrap py-4 pl-4 pr-5 text-right">
                  <a
                    :href="`${network.explorer}/address/${t.address}`"
                    target="_blank" rel="noopener"
                    class="group ml-auto inline-flex w-auto items-center justify-end gap-2 text-neutral-700 transition hover:text-neutral-900"
                    :title="t.address"
                  >
                    <span class="mono text-[14px]" x-text="shortAddr(t.address)"></span>
                    <svg class="h-[16px] w-[16px] shrink-0 text-neutral-400 transition group-hover:text-neutral-900" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                      <path d="M12 4h4v4M16 4l-7 7M14 12v3.5A1.5 1.5 0 0 1 12.5 17h-8A1.5 1.5 0 0 1 3 15.5v-8A1.5 1.5 0 0 1 4.5 6H8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </a>
                </td>

              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Data status -->
    <div class="mt-3 flex min-h-5 items-center justify-between px-1 text-[12px]">
      <span class="text-neutral-400">
        <!-- live figures are unlabelled; a frozen snapshot still says so, because
             stale numbers presented as current would be misleading -->
        <span x-show="dataMode === 'snapshot' && loadState === 'ready' && updatedAt">
          Snapshot · updated <span x-text="updatedAt"></span>
        </span>
      </span>
      <button
        x-show="loadState === 'error'"
        @click="load()"
        type="button"
        class="text-rose-700 underline decoration-rose-300 underline-offset-2 transition hover:decoration-rose-700"
      >
        Live metrics unavailable — retry
      </button>
    </div>

    <!-- Actions -->
    <div class="mt-10 flex flex-wrap items-center justify-center gap-3">
      <a
        href="https://app.zama.org/shield"
        target="_blank" rel="noopener"
        class="flex items-center gap-2 rounded-[10px] bg-neutral-900 px-5 py-2.5 text-sm text-white transition hover:bg-neutral-800"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M10 2.5l6 2.2v5c0 3.6-2.4 6.6-6 7.8-3.6-1.2-6-4.2-6-7.8v-5l6-2.2z" stroke-linejoin="round"/>
          <path d="M7.4 10.1l1.9 1.9 3.4-3.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Shield token
      </a>
      <a
        href="https://docs.zama.org/protocol/protocol-apps/confidential-tokens/confidential-wrapper"
        target="_blank" rel="noopener"
        class="rounded-[10px] border border-neutral-300 bg-white px-5 py-2.5 text-sm text-neutral-900 transition hover:border-neutral-400"
      >
        Read Docs ↗
      </a>
    </div>

    <!-- Footer -->
    <footer class="mx-auto mt-14 max-w-2xl border-t border-neutral-300/60 pt-6">
      <ul class="flex flex-wrap items-center justify-center gap-x-7 gap-y-2.5 text-center text-sm [&_a]:whitespace-nowrap">
        <li>
          <a
            href="https://zama.org/contact"
            target="_blank" rel="noopener"
            class="text-neutral-500 transition hover:text-neutral-900"
          >
            Suggest a new confidential token wrapper ↗
          </a>
        </li>
        <li>
          <a
            href="https://x.com/zama"
            target="_blank" rel="noopener"
            class="text-neutral-500 transition hover:text-neutral-900"
          >
            Zama on 𝕏 ↗
          </a>
        </li>
        <li>
          <a
            href="https://zama.org/community-channels"
            target="_blank" rel="noopener"
            class="text-neutral-500 transition hover:text-neutral-900"
          >
            Zama community channels ↗
          </a>
        </li>
      </ul>
    </footer>

  </div>
</div>

<script>
function registry() {
  return {
    open: false,
    query: '',
    current: 'ethereum',
    category: 'all',

    // live metrics from the TVS API, keyed by symbol
    api: 'https://tvs-api.up.railway.app/v1/tvs/tokens',
    live: {},
    loadState: 'loading',
    updatedAt: '',
    dataMode: 'live',

    sortKey: 'name',
    sortDir: 'asc',

    columns: [
      { key: 'name',       label: 'Name',             align: 'left'  },
      { key: 'tvs',        label: 'Shielded TVL',     align: 'right' },
      { key: 'holders',    label: 'Holders',          align: 'right' },
      { key: 'shielded',   label: 'Total Shielded',   align: 'right' },
      { key: 'unshielded', label: 'Total Unshielded', align: 'right' },
      { key: 'contract',   label: 'Contract',         align: 'right' },
    ],

    categories: [
      { id: 'all',        label: 'All' },
      { id: 'stablecoin', label: 'Stablecoins' },
      { id: 'yield',      label: 'Yield-bearing' },
      { id: 'crypto',     label: 'Crypto' },
      { id: 'rwa',        label: 'Real-world assets' },
    ],

    networks: [
      {
        id: 'ethereum',
        name: 'Ethereum',
        type: 'mainnet',
        chainId: 1,
        color: '#627EEA',
        explorer: 'https://eth.blockscout.com',
        allAddresses: 'https://docs.zama.ai/protocol',
        tokens: [
          { name: 'Confidential ZAMA',        symbol: 'cZAMA',       category: 'crypto',     address: '0x80CB147Fd86dC6dEe3Eee7e4Cee33d1397d98071', underlying: '0xA12CC123ba206d4031D1c7f6223D1C2Ec249f4f3', icon: 'confidentialtoken-logos/cZAMA.svg' },
          { name: 'Confidential USDT',        symbol: 'cUSDT',       category: 'stablecoin', address: '0xAe0207C757Aa2B4019Ad96edD0092ddc63EF0c50', underlying: '0xdAC17F958D2ee523a2206206994597C13D831ec7', icon: 'confidentialtoken-logos/cUSDT.svg' },
          { name: 'Confidential USDC',        symbol: 'cUSDC',       category: 'stablecoin', address: '0xe978F22157048E5DB8E5d07971376e86671672B2', underlying: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48', icon: 'confidentialtoken-logos/cUSDC.svg' },
          { name: 'Confidential WETH',        symbol: 'cWETH',       category: 'crypto',     address: '0xda9396b82634Ea99243cE51258B6A5Ae512D4893', underlying: '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2', icon: 'confidentialtoken-logos/cWETH.svg' },
          { name: 'Confidential BRON',        symbol: 'cBRON',       category: 'crypto',     address: '0x85dE671c3bec1aDeD752c3Cea943521181C826bc', underlying: '0xBA2C598E11eD093079cC324FCa5BbbA99F616E83', icon: 'confidentialtoken-logos/cBRON.svg' },
          { name: 'Confidential tGBP',        symbol: 'ctGBP',       category: 'stablecoin', address: '0xa873750ccBafD5ec7Dd13bfD5237d7129832eDD9', underlying: '0x27f6c8289550fce67f6b50bed1f519966afe5287', icon: 'confidentialtoken-logos/cTGBP.svg' },
          { name: 'Confidential XAUt',        symbol: 'cXAUt',       category: 'rwa',        address: '0x73cc9aF9d6BEFdb3c3fAf8a5E8c05Cb95FdaEEf1', underlying: '0x68749665FF8D2d112Fa859AA293F07A622782F38', icon: 'confidentialtoken-logos/cXAUt.svg' },
          { name: 'Confidential bbqTGBP',     symbol: 'cbbqTGBP',    category: 'yield',      address: '0xBA4cFF6ED6F7Cb2A58776dECa4E984b498446762', underlying: '0xbeeffABcd0dB09589Dd21854aa760C52aB4bf04F', icon: 'confidentialtoken-logos/cTGBP.svg' },
          { name: 'Confidential steakcUSDC',  symbol: 'csteakcUSDC', category: 'yield',      address: '0x66Bf74E96900D1a19c7070D939D124f2F565C458', underlying: '0xbEEF00A59B577423653A1526c7009bdE103F542B', icon: 'confidentialtoken-logos/cSTEAKCUSDC.svg' },
        ],
      },

      {
        id: 'polygon',
        name: 'Polygon',
        type: 'mainnet',
        chainId: 137,
        color: '#8247E5',
        explorer: 'https://polygon.blockscout.com',
        allAddresses: 'https://docs.zama.ai/protocol',
        // TODO: fill in Polygon mainnet deployment addresses
        tokens: [],
      },

      {
        id: 'sepolia',
        name: 'Ethereum Sepolia',
        type: 'testnet',
        chainId: 11155111,
        color: '#627EEA',
        explorer: 'https://eth-sepolia.blockscout.com',
        allAddresses: 'https://docs.zama.ai/protocol',
        // TODO: fill in Sepolia deployment addresses
        tokens: [],
      },

      {
        id: 'amoy',
        name: 'Polygon Amoy',
        type: 'testnet',
        chainId: 80002,
        color: '#8247E5',
        // TODO: Blockscout has no hosted Amoy instance (amoy. and polygon-amoy. both 404).
        // Falling back to Polygonscan until one exists.
        explorer: 'https://amoy.polygonscan.com',
        allAddresses: 'https://docs.zama.ai/protocol',
        // TODO: fill in Amoy deployment addresses
        tokens: [],
      },
    ],

    get network() { return this.networks.find(n => n.id === this.current); },

    async load() {
      this.loadState = 'loading';

      // A baked-in snapshot wins when present (used by the offline/artifact build,
      // where a strict CSP blocks outbound fetch). Absent in normal deployment.
      if (window.__TVS_SNAPSHOT__) {
        try {
          this.ingest(window.__TVS_SNAPSHOT__);
          this.dataMode = 'snapshot';
        } catch (e) {
          console.warn('snapshot unusable:', e.message);
          this.loadState = 'error';
        }
        return;
      }

      try {
        const res = await fetch(this.api, { headers: { accept: 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        this.ingest(await res.json());
        this.dataMode = 'live';
      } catch (e) {
        console.warn('TVS API unavailable:', e.message);
        this.live = {};
        this.loadState = 'error';
      }
    },

    ingest(json) {
      const rows = Array.isArray(json && json.data) ? json.data : [];
      if (!rows.length) throw new Error('empty payload');

      const map = {};
      let newest = 0;
      for (const r of rows) {
        if (!r || !r.symbol) continue;
        map[r.symbol] = r;
        const stamp = Date.parse((r.cumulative || {}).updated_at || '');
        if (!isNaN(stamp) && stamp > newest) newest = stamp;
      }
      this.live = map;
      this.updatedAt = newest ? new Date(newest).toLocaleString('en-GB', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'UTC'
      }) + ' UTC' : '';
      this.loadState = 'ready';
    },

    // The API has no chain dimension — it reports Ethereum mainnet only.
    metricsFor(symbol) {
      if (this.network.id !== 'ethereum') return null;
      const row = this.live[symbol];
      if (!row) return null;
      const c = row.cumulative || {};
      const price = parseFloat(c.price_usd);
      const shieldedTok   = parseFloat(c.shielded_tokens);
      const unshieldedTok = parseFloat(c.unshielded_tokens);
      const num = v => (isFinite(v) ? v : 0);
      return {
        tvsUsd:        num(parseFloat(c.tvs_onchain_usd)),
        tvsTok:        num(parseFloat(row.tvs_onchain_human ?? c.tvs_onchain_human)),
        holders:       typeof row.holders_count === 'number' ? row.holders_count : null,
        shieldedTok:   num(shieldedTok),
        unshieldedTok: num(unshieldedTok),
        // the API exposes no USD figure for these two, so derive from spot price
        shieldedUsd:   num(shieldedTok) * num(price),
        unshieldedUsd: num(unshieldedTok) * num(price),
      };
    },

    compact(v, prefix) {
      if (v === null || v === undefined || !isFinite(v) || v === 0) return '—';
      const a = Math.abs(v);
      if (a >= 1e9) return prefix + (v / 1e9).toFixed(2) + 'B';
      if (a >= 1e6) return prefix + (v / 1e6).toFixed(2) + 'M';
      if (a >= 1e3) return prefix + (v / 1e3).toFixed(2) + 'K';
      return prefix + v.toFixed(2);
    },
    fmtUsd(v) { return this.compact(v, '$'); },
    fmtNum(v) { return this.compact(v, ''); },
    fmtInt(v) { return (v === null || v === undefined) ? '—' : v.toLocaleString('en-US'); },
    shortAddr(a) { return a.slice(0, 6) + '…' + a.slice(-4); },

    toggleSort(key) {
      if (this.sortKey === key) {
        this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        this.sortKey = key;
        // text sorts read better A→Z; figures read better biggest-first
        this.sortDir = (key === 'name' || key === 'contract') ? 'asc' : 'desc';
      }
    },

    get sorted() {
      const dir = this.sortDir === 'asc' ? 1 : -1;
      const key = this.sortKey;
      const valueOf = t => {
        if (key === 'name') return t.name.toLowerCase();
        if (key === 'contract') return t.address.toLowerCase();
        const m = this.metricsFor(t.symbol);
        if (!m) return -Infinity;          // rows without data sink to the bottom
        if (key === 'tvs') return m.tvsUsd;
        if (key === 'holders') return m.holders === null ? -Infinity : m.holders;
        if (key === 'shielded') return m.shieldedUsd;
        if (key === 'unshielded') return m.unshieldedUsd;
        return 0;
      };
      return this.filtered.slice().sort((a, b) => {
        const va = valueOf(a), vb = valueOf(b);
        if (typeof va === 'string') return va.localeCompare(vb) * dir;
        if (va === vb) return a.symbol.localeCompare(b.symbol);
        return (va - vb) * dir;
      });
    },

    get filtered() {
      const q = this.query.trim().toLowerCase();
      return this.network.tokens.filter(t => {
        if (this.category !== 'all' && t.category !== this.category) return false;
        if (!q) return true;
        return t.name.toLowerCase().includes(q) ||
               t.symbol.toLowerCase().includes(q) ||
               t.address.toLowerCase().includes(q);
      });
    },

    countFor(id) {
      if (id === 'all') return this.network.tokens.length;
      return this.network.tokens.filter(t => t.category === id).length;
    },

    // only offer categories that exist on the selected network
    get shownCategories() {
      return this.categories.filter(c => this.countFor(c.id) > 0);
    },

    get groups() {
      return [
        { label: 'Mainnet', items: this.networks.filter(n => n.type === 'mainnet') },
        { label: 'Testnet', items: this.networks.filter(n => n.type === 'testnet') },
      ].filter(g => g.items.length > 0);
    },

    select(id) {
      this.current = id;
      this.open = false;
      // the active category may not exist on the new network
      if (this.countFor(this.category) === 0) this.category = 'all';
      try { history.replaceState(null, '', `?network=${id}`); } catch (e) {}
    },

    init() {
      const q = new URLSearchParams(location.search).get('network');
      if (this.networks.some(n => n.id === q)) this.current = q;
      this.load();
    },
  };
}
</script>
